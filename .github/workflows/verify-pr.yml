name: Verify — Parallel Lanes

# Runs the independent verification lanes concurrently on every PR to main.
# Mirrors conventions in ci.yml (Python 3.11, Mongo 7 service, uvicorn start, npm ci).
# NOTE: repo code lives under legacy-getszy/, so every cmd cds there.
on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  lane:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { lane: 1, kind: backend,  serve: true,  cmd: 'cd legacy-getszy/backend && python -m pytest tests/ -q -p no:cacheprovider -m "not integration"' }
          - { lane: 2, kind: frontend, serve: false, optional: true, cmd: 'cd legacy-getszy/frontend && yarn install --no-progress && CI=false yarn build' }
          - { lane: 3, kind: frontend, serve: false, cmd: 'cd legacy-getszy/frontend && npx playwright test --grep "(?i)builder" --project=chromium --project="Mobile Chrome"', optional: true }
          - { lane: 4, kind: backend,  serve: true,  cmd: 'cd legacy-getszy/backend && python -m pytest tests/test_builder_preview_security.py tests/test_security.py -q' }
          - { lane: 5, kind: backend,  serve: true,  cmd: 'cd legacy-getszy/backend && python -m pytest tests/test_production_hardening.py -q' }
          - { lane: 6, kind: backend,  serve: true,  cmd: 'cd legacy-getszy/backend && python -m pytest tests/test_builder_paid_operation_flow.py -q' }
          - { lane: 7, kind: frontend, serve: false, cmd: 'cd legacy-getszy/frontend && npx playwright test --grep "(?i)builder" --reporter=list', optional: true }
          - { lane: 8, kind: frontend, serve: false, cmd: 'cd legacy-getszy/frontend && npx playwright test --grep "(?i)(a11y|empty|error|loading|success)"', optional: true }
          - { lane: 9, kind: diff,     serve: false, optional: true, cmd: 'git fetch origin main -q || true; if git merge-base --is-ancestor origin/main HEAD 2>/dev/null; then git diff origin/main...HEAD --stat; git diff origin/main...HEAD | grep -nE "apiKey|secret\s*=|password\s*=|eval\(|dangerouslySetInnerHTML" || echo "no secret/anti-pattern hits"; else echo "no merge base with main; skipping diff scan"; fi' }
          - { lane: 10, kind: backend, serve: true,  cmd: 'for i in $(seq 1 20); do curl -fsS -o /dev/null -w "%{time_total}\n" http://localhost:8000/api/health; done | sort -n | awk ''BEGIN{n=0} {a[n++]=$1} END{printf "p50=%.3f p95=%.3f max=%.3f s\n", a[int(n*0.5)], a[int(n*0.95)], a[n-1]}''' }
    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
    env:
      MONGO_URL: mongodb://localhost:27017
      DB_NAME: getszy_test
      JWT_SECRET: test-secret-key-for-ci-use-only-32chars!!
      INTEGRATION_ENCRYPTION_KEY: test-integration-encryption-key-32chars!!
      SEED_ADMIN_EMAIL: admin@getszy.com
      SEED_ADMIN_PASSWORD: testpassword123
      ADMIN_EMAIL: admin@getszy.com
      ADMIN_PASSWORD: testpassword123
      SEED_CUSTOMER_PASSWORD: TestCustomer123!
      PLAYWRIGHT_BASE_URL: ${{ secrets.PLAYWRIGHT_BASE_URL }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        if: matrix.kind == 'backend'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install backend deps
        if: matrix.kind == 'backend'
        run: cd legacy-getszy/backend && pip install -r requirements.txt && pip install pytest httpx pytest-asyncio

      - name: Set up Node
        if: matrix.kind == 'frontend'
        uses: actions/setup-node@v5
        with:
          node-version: '20'

      - name: Install Yarn
        if: matrix.kind == 'frontend'
        continue-on-error: true
        run: npm install -g yarn

      - name: Install frontend deps
        if: matrix.kind == 'frontend'
        continue-on-error: true
        run: cd legacy-getszy/frontend && yarn install --no-progress

      - name: Install Playwright browsers
        if: contains(matrix.cmd, 'playwright')
        run: cd legacy-getszy/frontend && npx playwright install --with-deps chromium

      - name: Start backend server
        if: matrix.serve == true
        run: |
          cd legacy-getszy/backend
          python -m uvicorn server:app --host 0.0.0.0 --port 8000 > /tmp/getszy-api.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://localhost:8000/api/health >/dev/null && break; sleep 1; done
          curl -fsS http://localhost:8000/api/health >/dev/null || { cat /tmp/getszy-api.log; exit 1; }

      - name: Run lane ${{ matrix.lane }}
        continue-on-error: ${{ matrix.optional || false }}
        run: ${{ matrix.cmd }}
