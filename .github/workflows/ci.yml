name: CI/CD

on:
  push:
    branches: [main, remove-modern-getszy, develop]
  pull_request:
    branches: [main]

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
    env:
      MONGO_URL: mongodb://localhost:27017
      JWT_SECRET: test-secret-for-ci
      LLM_PROVIDER: groq
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      FREE_ONLY: 'true'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install backend dependencies
        run: |
          cd legacy-getszy/backend
          # emergentintegrations is only available on a private index (optional paid
          # LLM provider, lazily imported and blocked by FREE_ONLY). GitHub-hosted
          # runners can't reach it, so install everything else for CI/tests.
          grep -v '^emergentintegrations' requirements.txt > /tmp/req-ci.txt
          pip install -r /tmp/req-ci.txt

      - name: Run backend test suite
        run: |
          cd legacy-getszy/backend
          # Run the FULL suite (not just 2 files). Tests that require a live
          # external API (LLM/Razorpay/etc.) must be marked `@pytest.mark.integration`
          # so they can be excluded from CI; uncovered live failures surface here
          # on purpose — that is the point of the gate.
          python -m pytest tests/ -v -p no:cacheprovider

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Security scan (bandit + safety)
        run: |
          pip install bandit safety
          cd legacy-getszy/backend
          # High-severity only for bandit to avoid medium false positives blocking CI.
          bandit -r . -x ./tests,./venv -lll
          # Dependency CVE scan — fails loudly (no || true). If it flags an
          # acceptable transitive issue, pin it or `safety check --ignore <id>`.
          safety check

  deploy:
    needs: [backend-tests, security]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger VPS Deploy
        run: |
          # Surface the webhook result instead of failing silently. Non-2xx makes
          # the job fail so a broken deploy is never invisible.
          resp=$(curl -s -w "\nHTTP_STATUS:%{http_code}" -X POST https://getszy.com/hooks/deploy \
            -H "X-Token: ${{ secrets.DEPLOY_TOKEN }}" \
            -H "Content-Type: application/json" -d '{}' \
            --max-time 30 --retry 3 --retry-delay 5 --retry-all-errors) || true
          echo "$resp"
          status=$(echo "$resp" | tail -n1 | sed 's/HTTP_STATUS://')
          if [ "$status" != "200" ] && [ "$status" != "202" ]; then
            echo "::error::VPS deploy webhook returned HTTP $status — verify the deploy manually"
            exit 1
          fi
