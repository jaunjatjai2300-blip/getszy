name: CI/CD

on:
  push:
    branches: [main, remove-modern-getszy, develop]
  pull_request:
    branches: [main]

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
    env:
      MONGO_URL: mongodb://localhost:27017
      REDIS_URL: redis://localhost:6379
      JWT_SECRET: test-secret-for-ci
      LLM_PROVIDER: groq
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      FREE_ONLY: 'true'
      # First-run seeding requires these (enforced at startup). They are
      # throwaway CI values, not real secrets.
      SEED_ADMIN_EMAIL: admin@getszy.com
      SEED_ADMIN_PASSWORD: test-admin-pass-123
      SEED_CUSTOMER_PASSWORD: test-customer-pass-123
      # Live-server tests (test_auth) hit a LOCAL FastAPI instance started
      # below — never prod. API routes live under the `/api` prefix.
      TEST_API_URL: http://localhost:8000/api
      TEST_BASE_URL: http://localhost:8000
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install backend dependencies
        run: |
          cd legacy-getszy/backend
          # emergentintegrations is only available on a private index (optional paid
          # LLM provider, lazily imported and blocked by FREE_ONLY). GitHub-hosted
          # runners can't reach it, so install everything else for CI/tests.
          grep -v '^emergentintegrations' requirements.txt > /tmp/req-ci.txt
          pip install -r /tmp/req-ci.txt

      - name: Start FastAPI server in background
        run: |
          cd legacy-getszy/backend
          uvicorn server:app --host 0.0.0.0 --port 8000 > /tmp/uvicorn.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -s -o /dev/null -w "%{http_code}" http://localhost:8000/api/health 2>/dev/null | grep -q 200; then
              echo "Server is up!"
              break
            fi
            sleep 1
          done
          echo "=== uvicorn.log ==="
          cat /tmp/uvicorn.log
          curl -s -o /dev/null -w "%{http_code}" http://localhost:8000/api/health | grep -q 200 || { echo "Server failed to start"; exit 1; }

      - name: Run backend test suite
        run: |
          cd legacy-getszy/backend
          # Run the suite against the local server. Live-server tests that need a
          # deployed app + admin credentials or external APIs (test_critical_flows)
          # or a real Mongo bulk round-trip (marked @pytest.mark.integration) are
          # excluded from the blocking gate; they run against a real deploy via
          # TEST_BASE_URL/ADMIN_* env when desired.
          python -m pytest tests/ -v -p no:cacheprovider -m "not integration"

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Security scan (bandit + safety)
        run: |
          pip install bandit safety
          cd legacy-getszy/backend
          # High-severity only for bandit (low/medium are too noisy to gate on).
          bandit -r . -x ./tests,./venv -lll
          # Dependency CVE scan — fails loudly. The only currently-flagged
          # package is `ecdsa` (a transitive dep via web3/eth libs). 0.19.2 is
          # its latest release and it is NOT used for security-critical signing
          # in this app, so the over-broad Minerva advisory (IDs below) is
          # ignored with rationale. Genuinely new CVEs will still fail CI.
          safety check --ignore 64396 --ignore 64459

  deploy:
    needs: [backend-tests, security]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger VPS Deploy
        run: |
          # Surface the webhook result instead of failing silently. Non-2xx makes
          # the job fail so a broken deploy is never invisible.
          resp=$(curl -s -w "\nHTTP_STATUS:%{http_code}" -X POST https://getszy.com/hooks/deploy \
            -H "X-Token: ${{ secrets.DEPLOY_TOKEN }}" \
            -H "Content-Type: application/json" -d '{}' \
            --max-time 600 --retry 3 --retry-delay 5 --retry-all-errors) || true
          echo "$resp"
          status=$(echo "$resp" | tail -n1 | sed 's/HTTP_STATUS://')
          if [ "$status" != "200" ] && [ "$status" != "202" ]; then
            echo "::error::VPS deploy webhook returned HTTP $status — verify the deploy manually"
            exit 1
          fi
          # The webhook returns 200 even when the underlying deploy command fails
          # (ok:false). Fail loudly so a broken deploy is never invisible.
          if echo "$resp" | grep -q '"ok": *false'; then
            echo "::error::VPS deploy webhook reported ok:false (deploy command failed) — check VPS logs"
            exit 1
          fi
          # Post-deploy health verification: the webhook only confirms the deploy
          # command ran; now confirm the app actually serves traffic before we
          # call the pipeline green.
          for i in $(seq 1 30); do
            if curl -sSf -o /dev/null https://getszy.com/api/health; then
              echo "Deploy verified: /api/health OK"
              exit 0
            fi
            sleep 2
          done
          echo "::error::Deploy webhook succeeded but /api/health never came up — verify manually"
          exit 1
