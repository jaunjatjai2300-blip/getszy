name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: legacy-getszy
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      # compileall only byte-compiles (no imports), so it catches syntax errors
      # without needing the private dependency index or a live DB/Redis.
      - name: Backend syntax check
        run: python -m compileall -q backend

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: legacy-getszy/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm install
      - name: Frontend build
        run: npm run build
