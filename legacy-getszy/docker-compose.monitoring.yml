version: '3.8'

# Observability stack for Getszy. Run alongside the main app stack:
#   docker compose -f docker-compose.monitoring.yml up -d
# Both stacks share the fixed Docker network `getszy` (see docker-compose.yml),
# so Prometheus scrapes `backend:8001/metrics` directly and the exporters reach
# `mongo`. The main stack must be running first so the `getszy` network exists.

services:
  prometheus:
    image: prom/prometheus:v2.45.0
    container_name: getszy-prometheus
    restart: unless-stopped
    networks: [getszy]
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./alerts.yml:/etc/prometheus/alerts.yml:ro
      - ./alertmanager.yml:/etc/prometheus/alertmanager.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'

  alertmanager:
    image: prom/alertmanager:v0.26.0
    container_name: getszy-alertmanager
    restart: unless-stopped
    networks: [getszy]
    ports:
      - "9093:9093"
    volumes:
      - ./alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'

  grafana:
    image: grafana/grafana:10.0.0
    container_name: getszy-grafana
    restart: unless-stopped
    networks: [getszy]
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-getszy-change-on-deploy}
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus

  node-exporter:
    image: prom/node-exporter:v1.6.0
    container_name: getszy-node-exporter
    restart: unless-stopped
    networks: [getszy]
    ports:
      - "9100:9100"
    pid: host
    command:
      - '--path.rootfs=/host'
    volumes:
      - /:/host:ro,rslave

  mongodb-exporter:
    image: percona/mongodb_exporter:0.40.0
    container_name: getszy-mongodb-exporter
    restart: unless-stopped
    networks: [getszy]
    ports:
      - "9216:9216"
    environment:
      - MONGODB_URI=mongodb://mongo:27017
    # If using a separate Mongo service name, point MONGODB_URI at it.

volumes:
  prometheus_data:
  grafana_data:

# Join the main app stack's fixed network `getszy` so Prometheus can scrape
# `backend:8001` and the exporters can reach `mongo`. The main stack must be up first.
networks:
  getszy:
    external: true
