# Dedicated project name prevents monitoring startup or teardown from managing
# application containers in the main `legacy-getszy` Compose project.
name: getszy-monitoring

# Observability stack for Getszy. Run alongside the main app stack:
#   docker compose -p getszy-monitoring -f docker-compose.monitoring.yml up -d
# Both stacks share the fixed Docker network `getszy` (see docker-compose.yml),
# so Prometheus scrapes `backend:8001/metrics` directly and the exporters reach
# `mongo`. The main stack must be running first so the `getszy` network exists.

services:
  prometheus:
    image: prom/prometheus:v2.45.0
    container_name: getszy-prometheus
    restart: unless-stopped
    networks: [getszy]
    # Prometheus is reachable only through an SSH tunnel from the VPS.
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./alerts.yml:/etc/prometheus/alerts.yml:ro
      - ./alertmanager.yml:/etc/prometheus/alertmanager.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'

  alertmanager:
    image: prom/alertmanager:v0.26.0
    container_name: getszy-alertmanager
    restart: unless-stopped
    networks: [getszy]
    environment:
      ALERT_WEBHOOK_URL: "${ALERT_WEBHOOK_URL:?Set ALERT_WEBHOOK_URL in .env to receive production alerts}"
    # Alertmanager has no public UI; local access is for break-glass debugging only.
    ports:
      - "127.0.0.1:9093:9093"
    volumes:
      - ./alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    # The block is deliberately the sole item in the command list. Docker then
    # passes the entire script as one argument to `sh -c`; a scalar command is
    # otherwise split into words by Compose and executes only `test`.
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        test -n "$${ALERT_WEBHOOK_URL}"
        escaped_url=$$(printf '%s' "$${ALERT_WEBHOOK_URL}" | sed 's/[&|]/\\\\&/g')
        sed "s|__ALERT_WEBHOOK_URL__|$${escaped_url}|g" /etc/alertmanager/alertmanager.yml > /tmp/alertmanager.yml
        exec /bin/alertmanager --config.file=/tmp/alertmanager.yml

  grafana:
    image: grafana/grafana:10.0.0
    container_name: getszy-grafana
    restart: unless-stopped
    networks: [getszy]
    # Access Grafana using an SSH tunnel or place it behind authenticated SSO.
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:?Set GRAFANA_PASSWORD in .env}
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus

  node-exporter:
    image: prom/node-exporter:v1.6.0
    container_name: getszy-node-exporter
    restart: unless-stopped
    networks: [getszy]
    # Prometheus reaches this exporter through the internal getszy network.
    pid: host
    command:
      - '--path.rootfs=/host'
    volumes:
      - /:/host:ro,rslave

  mongodb-exporter:
    image: percona/mongodb_exporter:0.40.0
    container_name: getszy-mongodb-exporter
    restart: unless-stopped
    networks: [getszy]
    # Prometheus reaches this exporter through the internal getszy network.
    environment:
      - MONGODB_URI=mongodb://mongo:27017
    # If using a separate Mongo service name, point MONGODB_URI at it.

volumes:
  prometheus_data:
  grafana_data:

# Join the main app stack's fixed network `getszy` so Prometheus can scrape
# `backend:8001` and the exporters can reach `mongo`. The main stack must be up first.
networks:
  getszy:
    external: true
