<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 48" fill="none">
  <!-- Getszy Logo - Light version (for dark backgrounds) -->
  <defs>
    <linearGradient id="roseGoldLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D4A08F"/>
      <stop offset="50%" stop-color="#E8C4B8"/>
      <stop offset="100%" stop-color="#C58B7A"/>
    </linearGradient>
    <linearGradient id="tealLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3A9E99"/>
      <stop offset="100%" stop-color="#5BB8B3"/>
    </linearGradient>
  </defs>
  <!-- Sparkle accent -->
  <path d="M8 24 L12 16 L16 24 L12 32 Z" fill="url(#tealLight)" opacity="0.9"/>
  <circle cx="12" cy="12" r="2" fill="url(#tealLight)" opacity="0.6"/>
  <circle cx="20" cy="20" r="1.5" fill="url(#roseGoldLight)" opacity="0.5"/>
  <!-- Wordmark -->
  <text x="32" y="34" font-family="Georgia, 'Times New Roman', serif" font-size="36" font-weight="400" letter-spacing="-1" fill="#FBF7F2">getszy</text>
</svg>