services:
  mongo:
    image: mongo:7
    container_name: getszy-mongo
    restart: unless-stopped
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    volumes:
      - mongo_data:/data/db
    networks: [getszy]
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 30s
      timeout: 10s
      retries: 5

  # One-shot: initiate the replica set so MongoDB change streams (catalog
  # auto-sync) work. Exits 0 once rs0 is initialized.
  mongo-init:
    image: mongo:7
    container_name: getszy-mongo-init
    restart: "no"
    depends_on:
      mongo:
        condition: service_healthy
    networks: [getszy]
    command: >
      bash -c '
        for i in $(seq 1 30); do
          # Idempotent: if the replica set is already initialized (data persisted
          # from a previous run), rs.status() succeeds -> we are done.
          if mongosh --quiet --host mongo:27017 --eval "rs.status().ok" 2>/dev/null | grep -q "^1$"; then
            echo "replica set already initialized"; exit 0;
          fi
          # Otherwise attempt to initiate it (fails fast if already initialized).
          if mongosh --quiet --host mongo:27017 --eval "rs.initiate({_id:\"rs0\",members:[{_id:0,host:\"mongo:27017\"}]})" 2>/dev/null; then
            mongosh --quiet --host mongo:27017 --eval "while(!rs.isMaster().ismaster){sleep(1000)}" 2>/dev/null;
            echo "replica set initialized"; exit 0;
          fi
          echo "waiting for mongo..."; sleep 3;
        done;
        exit 1;
      '

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: getszy-backend
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
      mongo-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    environment:
      MONGO_URL: "mongodb://mongo:27017/?replicaSet=rs0"
      REDIS_URL: "redis://redis:6379/0"
      BACKUP_DIR: "/app/backups"
      BACKUP_INTERVAL_HOURS: "${BACKUP_INTERVAL_HOURS:-4}"
      BACKUP_RETENTION_DAILY: "${BACKUP_RETENTION_DAILY:-7}"
      BACKUP_RETENTION_WEEKLY: "${BACKUP_RETENTION_WEEKLY:-5}"
      BACKUP_RETENTION_MONTHLY: "${BACKUP_RETENTION_MONTHLY:-12}"
      BACKUP_S3_BUCKET: "${BACKUP_S3_BUCKET:-}"
      BACKUP_S3_ENDPOINT_URL: "${BACKUP_S3_ENDPOINT_URL:-}"
      BACKUP_S3_REGION: "${BACKUP_S3_REGION:-us-east-1}"
      BACKUP_S3_PREFIX: "${BACKUP_S3_PREFIX:-getszy-backups}"
      # AWS / S3-compatible credentials consumed by boto3 for off-site sync.
      AWS_ACCESS_KEY_ID: "${AWS_ACCESS_KEY_ID:-}"
      AWS_SECRET_ACCESS_KEY: "${AWS_SECRET_ACCESS_KEY:-}"
      DB_NAME: "getszy_db"
      CORS_ORIGINS: "${CORS_ORIGINS:-https://getszy.com,https://www.getszy.com}"
      JWT_SECRET: "${JWT_SECRET}"
      FREE_ONLY: "${FREE_ONLY:-true}"
      LLM_PROVIDER: "${LLM_PROVIDER:-ollama}"
      # Host Ollama (already running on the VPS, port 11434). host.docker.internal
      # is mapped to the host gateway via extra_hosts below.
      OLLAMA_BASE_URL: "${OLLAMA_BASE_URL:-http://host.docker.internal:11434}"
      OLLAMA_MODEL: "${OLLAMA_MODEL:-qwen2.5:7b}"
      OLLAMA_MODEL_2: "${OLLAMA_MODEL_2:-qwen2.5-coder:7b}"
      OLLAMA_MODEL_3: "${OLLAMA_MODEL_3:-llama3.2:3b}"
      LMSTUDIO_BASE_URL: "${LMSTUDIO_BASE_URL:-http://host.docker.internal:1234/v1}"
      LMSTUDIO_MODEL: "${LMSTUDIO_MODEL:-longcat2.0}"
      SEED_ADMIN_EMAIL: "${SEED_ADMIN_EMAIL:-admin@getszy.com}"
      SEED_ADMIN_PASSWORD: "${SEED_ADMIN_PASSWORD}"
      SEED_CUSTOMER_EMAIL: "${SEED_CUSTOMER_EMAIL:-customer@getszy.com}"
      SEED_CUSTOMER_PASSWORD: "${SEED_CUSTOMER_PASSWORD:-ChangeMeNow!}"
      GROQ_API_KEY: "${GROQ_API_KEY:-}"
      GROQ_MODEL: "${GROQ_MODEL:-openai/gpt-oss-120b}"
      GEMINI_API_KEY: "${GEMINI_API_KEY:-}"
      OPENROUTER_API_KEY: "${OPENROUTER_API_KEY:-}"
      OPENROUTER_MODEL: "${OPENROUTER_MODEL:-qwen/qwen-2.5-72b-instruct}"
      EMERGENT_LLM_KEY: "${EMERGENT_LLM_KEY:-}"
      EMERGENT_MODEL: "${EMERGENT_MODEL:-gpt-4o-mini}"
      GITHUB_TOKEN: "${GITHUB_TOKEN:-}"
      GITHUB_REPO: "${GITHUB_REPO:-jaunjatjai2300-blip/getszy}"
      GITHUB_BRANCH: "${GITHUB_BRANCH:-main}"
      DEPLOY_WEBHOOK_URL: "${DEPLOY_WEBHOOK_URL:-}"
      DEPLOY_WEBHOOK_TOKEN: "${DEPLOY_WEBHOOK_TOKEN:-}"
      RAZORPAY_KEY_ID: "${RAZORPAY_KEY_ID:-}"
      RAZORPAY_KEY_SECRET: "${RAZORPAY_KEY_SECRET:-}"
      RAZORPAY_WEBHOOK_SECRET: "${RAZORPAY_WEBHOOK_SECRET:-}"
      RAZORPAY_PLAN_PRO: "${RAZORPAY_PLAN_PRO:-}"
      RAZORPAY_PLAN_ELITE: "${RAZORPAY_PLAN_ELITE:-}"
      RAZORPAY_PLAN_CREATOR: "${RAZORPAY_PLAN_CREATOR:-}"

      # --- Creator / Video features (Phase 1/2) ---
      # HF_TOKEN unlocks FLUX (images), XTTS (voice), SadTalker (avatar), CogVideoX.
      HF_TOKEN: "${HF_TOKEN:-}"
      MEDIA_PROVIDER: "${MEDIA_PROVIDER:-free}"
      FAL_KEY: "${FAL_KEY:-}"
      REPLICATE_TOKEN: "${REPLICATE_TOKEN:-}"
      # Self-hosted GPU box running a /lipsync endpoint (real lip-sync).
      GPU_HOST: "${GPU_HOST:-}"
      # Whisper STT for YouTube transcript ingest (one-tap repurposing).
      OPENAI_API_KEY: "${OPENAI_API_KEY:-}"
      # One-click social distribution (stored tokens via /social-connect).
      YOUTUBE_CLIENT_ID: "${YOUTUBE_CLIENT_ID:-}"
      YOUTUBE_CLIENT_SECRET: "${YOUTUBE_CLIENT_SECRET:-}"
      META_APP_ID: "${META_APP_ID:-}"
      META_APP_SECRET: "${META_APP_SECRET:-}"
      # Web search tools (optional).
      TAVILY_API_KEY: "${TAVILY_API_KEY:-}"
      BRAVE_API_KEY: "${BRAVE_API_KEY:-}"
      SENTRY_DSN: "${SENTRY_DSN:-}"
      LOGTAIL_KEY: "${LOGTAIL_KEY:-}"
    networks: [getszy]
    volumes:
      - backend_media:/app/backend/media
      - backend_backups:/app/backups
    extra_hosts:
      - "host.docker.internal:host-gateway"

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        REACT_APP_BACKEND_URL: "${PUBLIC_URL}"
    container_name: getszy-frontend
    restart: unless-stopped
    depends_on: [backend]
    networks: [getszy]

  caddy:
    image: caddy:2-alpine
    container_name: getszy-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: "${DOMAIN}"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on: [backend, frontend]
    networks: [getszy]

  redis:
    image: redis:7-alpine
    container_name: getszy-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 5s
      retries: 5
    networks: [getszy]

volumes:
  mongo_data:
  caddy_data:
  caddy_config:
  backend_media:
  backend_backups:
  redis_data:

networks:
  getszy:
    name: getszy
    driver: bridge
