# Rendered by docker-compose.monitoring.yml at container start.
# Production requires ALERT_WEBHOOK_URL in .env. The template token is intentionally
# invalid until rendered so operators cannot silently deploy alerts with no sink.
global:
  resolve_timeout: 5m

route:
  receiver: 'production-webhook'
  group_by: ['alertname', 'severity']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h

receivers:
  - name: 'production-webhook'
    webhook_configs:
      - url: '__ALERT_WEBHOOK_URL__'
        send_resolved: true

