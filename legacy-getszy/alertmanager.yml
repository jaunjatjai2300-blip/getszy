route:
  receiver: 'default'
  group_by: ['alertname', 'severity']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h

receivers:
  - name: 'default'
    # Replace with your real alert sink (Slack/Discord/email/PagerDuty) via env.
    webhook_configs:
      - url: '${ALERT_WEBHOOK_URL:-http://localhost:5001/alerts}'
        send_resolved: true
