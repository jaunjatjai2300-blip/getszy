global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

scrape_configs:
  - job_name: 'getszy-backend'
    metrics_path: /metrics
    static_configs:
      # Backend listens on :8001 inside the shared `getszy` Docker network.
      # The monitoring stack joins that network (docker-compose.monitoring.yml),
      # so the service name resolves directly — no host port / Caddy involved.
      - targets: ['backend:8001']

  - job_name: 'node'
    static_configs:
      - targets: ['node-exporter:9100']

  - job_name: 'mongodb'
    static_configs:
      - targets: ['mongodb-exporter:9216']
