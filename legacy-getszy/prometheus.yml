global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

scrape_configs:
  - job_name: 'getszy-backend'
    metrics_path: /metrics
    static_configs:
      # App runs on the host network (Caddy -> backend:8000). Use host.docker.internal
      # from inside the monitoring stack, or change to the backend service name if
      # both stacks share a Docker network.
      - targets: ['host.docker.internal:8000']

  - job_name: 'node'
    static_configs:
      - targets: ['node-exporter:9100']

  - job_name: 'mongodb'
    static_configs:
      - targets: ['mongodb-exporter:9216']
