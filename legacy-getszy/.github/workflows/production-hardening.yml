name: Production Hardening

# Automates the production-launch-hardening gate:
#   1. Security audit (Bandit) + lint (Flake8)
#   2. Real test suite against a MongoDB service container
#   3. Docker image build verification (backend + frontend)
# Deploy (deploy.yml) only runs AFTER this workflow succeeds on main.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  security:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: legacy-getszy/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install security tooling
        run: pip install bandit flake8
      - name: Bandit security audit
        # Fail the build on medium+ severity findings (no `|| true`).
        run: bandit -r . -ll -s B101,B601
      - name: Runtime-safety lint gate
        # Block only syntax and undefined-name defects that can fail real requests.
        # Legacy formatting debt is reported separately until it is remediated.
        run: flake8 . --select=F821,F822,F823,E9 --max-line-length=120
      - name: Legacy style-debt report
        run: flake8 . --max-line-length=120 --extend-ignore=E402,F401,E501,W503,E203 --exit-zero --statistics

  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: legacy-getszy/backend
    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
    env:
      MONGO_URL: mongodb://localhost:27017
      DB_NAME: getszy_test
      JWT_SECRET: test-secret-key-for-ci-use-only-32chars!!
      OLLAMA_BASE_URL: http://localhost:11434
      SEED_ADMIN_EMAIL: admin@getszy.com
      SEED_ADMIN_PASSWORD: testpassword123
      SEED_CUSTOMER_PASSWORD: TestCustomer123!
      ADMIN_EMAIL: admin@getszy.com
      ADMIN_PASSWORD: testpassword123
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest httpx
      - name: Run deterministic unit and Mongo integration matrix
        run: |
          python -m pytest tests/test_llm_provider.py \
            tests/test_video_factory.py tests/test_llm_fallback.py \
            tests/test_gst_invoice.py tests/test_einvoice.py \
            tests/test_backup_restore.py tests/test_workspace_live.py \
            -v --tb=short
      - name: Run critical HTTP flow tests against local API
        env:
          TEST_BASE_URL: http://localhost:8000/api
          TEST_API_URL: http://localhost:8000/api
        run: |
          python -m uvicorn server:app --host 127.0.0.1 --port 8000 > /tmp/getszy-api.log 2>&1 &
          for i in $(seq 1 30); do
            curl -fsS http://localhost:8000/api/health >/dev/null && break
            sleep 1
          done
          curl -fsS http://localhost:8000/api/health >/dev/null || { cat /tmp/getszy-api.log; exit 1; }
          python -m pytest tests/test_auth.py tests/test_critical_flows.py -v --tb=short

  build:
    needs: [security, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build backend image (verify only)
        uses: docker/build-push-action@v6
        with:
          context: ./legacy-getszy
          file: ./legacy-getszy/Dockerfile.backend
          push: false
          tags: getszy-backend:ci
      - name: Build frontend image (verify only)
        uses: docker/build-push-action@v6
        with:
          context: ./legacy-getszy
          file: ./legacy-getszy/Dockerfile.frontend
          push: false
          tags: getszy-frontend:ci

  frontend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: legacy-getszy/frontend
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: legacy-getszy/frontend/package-lock.json
      - name: Install dependencies
        run: npm ci || npm install
      - name: Build frontend (production)
        # REACT_APP_* vars are inlined at build time; CI uses safe placeholders.
        env:
          REACT_APP_BACKEND_URL: ''
          REACT_APP_SENTRY_DSN: ''
          REACT_APP_ENV: ci
        run: npm run build
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: legacy-getszy/frontend/build
