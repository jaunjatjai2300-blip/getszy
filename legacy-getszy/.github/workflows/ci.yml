name: CI — Critical Flow Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017

    env:
      MONGO_URL: mongodb://localhost:27017
      DB_NAME: getszy_test
      JWT_SECRET: test-secret-key-for-ci-use-only-32chars!!
      OLLAMA_BASE_URL: http://localhost:11434
      # Seed a known admin so the server can start and the flow tests can log in.
      SEED_ADMIN_EMAIL: admin@getszy.com
      SEED_ADMIN_PASSWORD: testpassword123
      ADMIN_EMAIL: admin@getszy.com
      ADMIN_PASSWORD: testpassword123

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}

      - name: Install dependencies
        run: |
          cd backend
          pip install -r requirements.txt
          pip install pytest httpx

      - name: Run unit tests
        run: |
          cd backend
          python -m pytest tests/test_auth.py tests/test_llm_provider.py -v --tb=short

      - name: Run critical flow tests
        env:
          TEST_BASE_URL: http://localhost:8000
        run: |
          cd backend
          # Start server in background
          python -m uvicorn server:app --host 0.0.0.0 --port 8000 &
          sleep 5
          python -m pytest tests/test_critical_flows.py -v --tb=short
