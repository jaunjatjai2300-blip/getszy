name: Auto-Deploy to Getszy VPS

# Only deploy after the Production Hardening gate passes on main.
on:
  workflow_run:
    workflows: ["Production Hardening"]
    types: [completed]

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' }}
    runs-on: ubuntu-latest
    steps:
      - name: Trigger VPS deploy webhook
        run: |
          RESPONSE=$(curl -s -w "\nHTTP:%{http_code}" -X POST \
            https://getszy.com/hooks/deploy \
            -H "X-Token: ${{ secrets.WEBHOOK_TOKEN }}" \
            --max-time 600)
          echo "$RESPONSE"
          HTTP_CODE=$(echo "$RESPONSE" | tail -n1 | cut -d: -f2)
          if [ "$HTTP_CODE" != "200" ]; then
            echo "::error::Webhook returned HTTP $HTTP_CODE"
            exit 1
          fi
          echo "Deploy triggered successfully"
